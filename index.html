<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desarrollo de Interfaces</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css" id="theme">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

    <style>
/* Contenedor */
.reveal .mermaid {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 1.5em auto;
    width: 100%;
    overflow: visible !important;
}

/* SVG: reducir font-size base */
.reveal .mermaid svg {
    font-size: 1.2rem !important; /*ajusto tamño del texto dentro de los nodos*/
    max-width: 100%;
    height: auto !important;
    overflow: visible !important;
}

/* CRÍTICO: permitir wrap en los labels */
.reveal .mermaid .label div,
.reveal .mermaid .nodeLabel,
.reveal .mermaid .edgeLabel {
    white-space: normal !important;
    word-wrap: break-word !important;
    overflow: visible !important;
    min-width: auto !important;
    min-height: auto !important;
}

/* Asegurar que los foreignObject no recorten */
.reveal .mermaid foreignObject {
    overflow: visible !important;
}

/* Nodos y aristas */
.reveal .mermaid .node text,
.reveal .mermaid .edgeLabel text {
    font-size: 10px !important;
    line-height: 1.3;
}

/* Slides sin recorte */
.reveal .slides section {
    overflow: visible !important;
    height: auto !important;
}

        .reveal pre code {
            max-height: 360px;
            overflow-y: auto;
            font-size: 80%;
        }

        .toolbar {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }

        .toolbar select {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.92);
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            outline: none;
            max-width: 200px;
        }

        .toolbar select:hover {
            border-color: #999;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.4rem;
            color: #888;
            z-index: 200;
            font-family: system-ui, sans-serif;
        }

        .reveal .mermaid-error {
            display: block;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 6px;
            padding: 12px;
            color: #c53030;
            font-size: 12px;
            white-space: pre-wrap;
            text-align: left;
            margin: 0.5em 0;

        }

.diapositiva {
    font-size: 1.5rem;
}

.mini {
    font-size: 1rem;
}
    </style>
</head>
<body>

    <div class="toolbar">
        <select id="theme-selector" title="Tema"></select>
        <select id="unit-selector" title="Seleccionar unidad"></select>
    </div>

    <div id="loading">Cargando presentación…</div>

    <div class="reveal">
        <div class="slides"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>

    <script>
        (function () {
            'use strict';

            const MD_RE = /```mermaid\s*\n([\s\S]*?)```/g;
            const SEPARATOR = '^---$';
            const SEPARATOR_VERT = '^--$';
            const MAX_UNITS = 20;

            const units = [];
            for (let i = 1; i <= MAX_UNITS; i++) {
                units.push('unidad-' + String(i).padStart(2, '0') + '.md');
            }

            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                fontFamily: 'inherit',
                flowchart: {
                    useMaxWidth: true,
                    htmlLabels: true,
                    padding: 20,        // ← AUMENTA el padding interno de nodos
                    nodeSpacing: 50,    // ← Más espacio entre nodos
                    rankSpacing: 80,    // ← Más espacio entre niveles
                    curve: 'basis'
                },
                themeVariables: {
                    fontSize: '1.2rem',   // ← Font-size base de Mermaid - Aquí agrando los nodos
                    fontFamily: 'Segoe UI, sans-serif'
                }

            });

            const params = new URLSearchParams(window.location.search);
            let currentMd = params.get('md') || units[0];
            if (!units.includes(currentMd)) currentMd = units[0];

            var themes = [
                { name: 'white',     label: 'White' },
                { name: 'black',     label: 'Black' },
                { name: 'league',    label: 'League' },
                { name: 'sky',       label: 'Sky' },
                { name: 'beige',     label: 'Beige' },
                { name: 'simple',    label: 'Simple' },
                { name: 'serif',     label: 'Serif' },
                { name: 'night',     label: 'Night' },
                { name: 'moon',      label: 'Moon' },
                { name: 'solarized', label: 'Solarized' },
                { name: 'blood',     label: 'Blood' },
                { name: 'dracula',   label: 'Dracula' },
            ];

            var defaultTheme = 'dracula';
            var currentTheme = params.get('theme') || localStorage.getItem('reveal-theme') || defaultTheme;

            var themeValid = themes.some(function (t) { return t.name === currentTheme; });
            if (!themeValid) currentTheme = defaultTheme;

            function applyTheme(name) {
                var theme = themes.find(function (t) { return t.name === name; });
                var href = theme.url || 'https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/' + name + '.css';
                document.getElementById('theme').href = href;
                localStorage.setItem('reveal-theme', name);
            }

            applyTheme(currentTheme);

            function buildUrl(md, theme) {
                var p = [];
                if (md && md !== units[0]) p.push('md=' + encodeURIComponent(md));
                if (theme && theme !== defaultTheme) p.push('theme=' + encodeURIComponent(theme));
                return p.length ? '?' + p.join('&') : '?';
            }

            var themeSel = document.getElementById('theme-selector');
            themes.forEach(function (t) {
                var opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.label;
                if (t.name === currentTheme) opt.selected = true;
                themeSel.appendChild(opt);
            });

            themeSel.addEventListener('change', function () {
                var md = params.get('md') || units[0];
                window.location.href = buildUrl(md, this.value);
            });

            var unitSelector = document.getElementById('unit-selector');
            units.forEach(function (file, index) {
                var opt = document.createElement('option');
                opt.value = file;
                opt.textContent = 'Unidad ' + (index + 1);
                if (file === currentMd) opt.selected = true;
                unitSelector.appendChild(opt);
            });

            unitSelector.addEventListener('change', function () {
                window.location.href = buildUrl(this.value, currentTheme);
            });

            async function renderMermaidOnSlide(slide) {
                var els = slide.querySelectorAll('.mermaid:not([data-processed])');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    try {
                        var id = 'm-' + Math.random().toString(36).slice(2, 10);
                        var code = el.textContent.trim()
                            .replace(/<br\b[^>]*>/gi, '<br/>');
                        if (!code) continue;
                        var result = await mermaid.render(id, code);
                        el.innerHTML = result.svg;
                    } catch (e) {
                        el.innerHTML = '<pre class="mermaid-error">Error al renderizar diagrama:\n' + e.message + '</pre>';
                    }
                    el.setAttribute('data-processed', 'true');
                }
            }

            async function loadPresentation(mdFile) {
                try {
                    var resp = await fetch(mdFile);
                    if (!resp.ok) throw new Error('HTTP ' + resp.status);
                    var content = await resp.text();

                    content = content.replace(MD_RE, function (_, code) {
                        return '<div class="mermaid">\n' + code.trim() + '\n</div>';
                    });

                    var titleMatch = content.match(/^##\s+(.*?)(?:\s*<!--.*-->)?$/m);
                    if (titleMatch) {
                        document.title = titleMatch[1];
                    }

                    var slidesEl = document.querySelector('.reveal .slides');
                    var section = document.createElement('section');
                    section.setAttribute('data-markdown', '');
                    section.setAttribute('data-separator', SEPARATOR);
                    section.setAttribute('data-separator-vertical', SEPARATOR_VERT);

                    var template = document.createElement('script');
                    template.type = 'text/template';
                    template.textContent = content;
                    section.appendChild(template);

                    slidesEl.innerHTML = '';
                    slidesEl.appendChild(section);

                    var deck = new Reveal({
                        hash: true,
                        center: true,
                        transition: 'slide',
                        margin: 0.04,
                        markdown: { smartypants: true },
                        plugins: [RevealMarkdown, RevealNotes, RevealHighlight]
                    });

                    deck.on('ready', function () {
                        document.getElementById('loading').style.display = 'none';
                        var current = deck.getCurrentSlide();
                        if (current) renderMermaidOnSlide(current);
                    });

                    deck.on('slidechanged', function (event) {
                        if (event && event.currentSlide) {
                            renderMermaidOnSlide(event.currentSlide);
                        }
                    });

                    await deck.initialize();

                } catch (error) {
                    document.getElementById('loading').textContent =
                        'Error al cargar ' + mdFile + ': ' + error.message;
                    console.error(error);
                }
            }

            loadPresentation(currentMd);
        })();
    </script>
</body>
</html>
